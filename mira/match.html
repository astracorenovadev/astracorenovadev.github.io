<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira · Star compatibility</title>
  <meta name="robots" content="noindex">
  <!-- Вайб-код живе у фрагменті (#…): браузер не надсилає його серверу, сторінка читає його лише локально. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #16213f, #04060f 70%); color: #ede7da; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(420px, 100% - 40px); text-align: center; padding: 40px 0; }
    .label { color: #d8b878; letter-spacing: .28em; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: 40px; margin: 18px 0 4px; }
    .title { color: #ebd19c; font-weight: 700; margin: 0 0 18px; }
    .muted { color: #8c97a8; font-size: 14px; }
    a.button { display: block; margin: 12px 0; padding: 16px; border-radius: 999px; text-decoration: none; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .gold { background: linear-gradient(135deg, #ebd19c, #b88a45); color: #0a1220; }
    .ghost { border: 1px solid #7db8b3; color: #7db8b3; }
    ul { list-style: none; padding: 0; margin: 0 0 22px; color: #d9d4ca; }
  </style>
</head>
<body>
<main>
  <div class="label">Mira · Star compatibility</div>
  <h1 id="who">Someone</h1>
  <p class="title" id="sign">wants to check your star compatibility</p>
  <ul id="details"></ul>
  <a class="button gold" id="open" href="#">Open in Mira</a>
  <a class="button ghost" href="https://play.google.com/store/apps/details?id=com.astravibe.app">Get Mira on Google Play</a>
  <p class="muted">Mira turns your moments into soundtracks. After installing, open this link again to see your match.</p>
</main>
<script>
  const titles = { LYRA: "Lyra · The Night Romantic", CYGNUS: "Cygnus · The Dreamer", URSA_MAJOR: "Ursa Major · The Cozy Soul",
    CASSIOPEIA: "Cassiopeia · The Aesthete", AQUILA: "Aquila · The Focused One", LEO: "Leo · The Main Character",
    DELPHINUS: "Delphinus · The Joker", ORION: "Orion · The Rebel", SCORPIUS: "Scorpius · The Mystery",
    GEMINI: "Gemini · The Chameleon", PEGASUS: "Pegasus · The Wanderer", HERCULES: "Hercules · The Rising One" };
  const fragment = location.hash.slice(1);
  document.getElementById("open").href = "astravibe://match#" + fragment;
  try {
    const b64 = fragment.replace(/^v1\./, "").replace(/-/g, "+").replace(/_/g, "/");
    const json = new TextDecoder().decode(Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0)));
    const code = JSON.parse(json);
    const text = (id, value) => { document.getElementById(id).textContent = value; };
    if (code.n) text("who", String(code.n).slice(0, 24));
    if (titles[code.c]) text("sign", titles[code.c]);
    const list = document.getElementById("details");
    (code.a || []).slice(0, 3).forEach(artist => { const li = document.createElement("li"); li.textContent = "♪ " + String(artist).slice(0, 80); list.appendChild(li); });
  } catch (e) { /* неправильний код — лишаємо загальний текст */ }
</script>
</body>
</html>
